spring.application.name=tradeflow-order-service
server.port=8082

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Advertise IP instead of machine hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tradeflow_order_db
spring.datasource.username=root
spring.datasource.password=manager

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Saga recovery
tradeflow.saga.recovery-delay-ms=30000

# Feign timeouts
spring.cloud.openfeign.client.config.tradeflow-product-service.connectTimeout=3000
spring.cloud.openfeign.client.config.tradeflow-product-service.readTimeout=10000

# ==========================================
# KAFKA PRODUCER CONFIGURATION
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5