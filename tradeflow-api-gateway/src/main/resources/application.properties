spring.application.name=tradeflow-api-gateway

server.port=8080
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.route[0].id=product-service
spring.cloud.gateway.server.webflux.route[0].uri=lb://tradeflow-product-service
spring.cloud.gateway.server.webflux.route[0].predicates=path=/products/**

spring.cloud.gateway.server.webflux.route[1].id=order-service
spring.cloud.gateway.server.webflux.route[1].uri=lb://tradeflow-order-service
spring.cloud.gateway.server.webflux.route[].predicates=path=/orders/**


