spring.application.name=tradeflow-notification-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/tradeflow_notification_db
spring.datasource.username=root
spring.datasource.password=manager

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# KAFKA CONSUMER CONFIGURATION
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=tradeflow-notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.tradeflow.tradeflow_notification_service.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.tradeflow.tradeflow_notification_service.event.OrderConfirmedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false